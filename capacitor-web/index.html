<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b172a" />
    <title>AutoHelp Lesotho</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #0b172a;
        color: #f8fafc;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        text-align: center;
      }

      main {
        max-width: 24rem;
        padding: 2rem;
      }

      .mark {
        display: grid;
        width: 5rem;
        height: 5rem;
        margin: 0 auto 1.5rem;
        place-items: center;
        border: 2px solid #20c997;
        border-radius: 1.5rem;
        color: #20c997;
        font-size: 2rem;
        font-weight: 800;
      }

      p {
        color: #a8b3c5;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">A</div>
      <h1>AutoHelp Lesotho</h1>
      <p>The Android app needs the AutoHelp web server. Start the development server and sync the Android project again.</p>
    </main>
  </body>
</html>
